services:
  dmz-gw:
    build:
      context: ./services/dmz-gw
    container_name: neobank-dmz-gw
    environment:
      CORE_BASE_URL: http://core-svc:8000
    networks:
      - dmz-net
      - core-net
    depends_on:
      core-svc:
        condition: service_started
    ports:
      - "8000:8000"

  corp-agent:
    build:
      context: ./services/corp-agent
    container_name: neobank-corp-agent
    environment:
      CORE_DB_HOST: core-db
      CORE_DB_PORT: "5432"
      CORE_DB_NAME: ${CORE_DB_NAME}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      SUPPORT_AGENT_MODE: ${SUPPORT_AGENT_MODE:-mock}
      SUPPORT_AGENT_MODEL: ${SUPPORT_AGENT_MODEL:-gpt-4o-mini}
      SUPPORT_AGENT_BASE_URL: ${SUPPORT_AGENT_BASE_URL:-https://api.openai.com/v1}
      SUPPORT_AGENT_API_KEY: ${SUPPORT_AGENT_API_KEY:-}
    networks:
      - corp-net
      - core-net
      - core-db-net
    depends_on:
      core-db:
        condition: service_healthy
    ports:
      - "8003:8000"

  core-svc:
    build:
      context: ./services/core-svc
    container_name: neobank-core-svc
    environment:
      CORE_DB_HOST: core-db
      CORE_DB_PORT: "5432"
      CORE_DB_NAME: ${CORE_DB_NAME}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      PCI_AUTH_BASE_URL: http://pci-svc:8000
    networks:
      - core-net
      - pci-net
      - core-db-net
    depends_on:
      core-db:
        condition: service_healthy
      pci-svc:
        condition: service_started
    ports:
      - "8002:8000"

  pci-svc:
    build:
      context: ./services/pci-auth-svc
    container_name: neobank-pci-svc
    environment:
      PCI_DB_HOST: pci-db
      PCI_DB_PORT: "5432"
      PCI_DB_NAME: ${PCI_DB_NAME}
      PCI_DB_USER: ${PCI_DB_USER}
      PCI_DB_PASSWORD: ${PCI_DB_PASSWORD}
    networks:
      - pci-net
      - pci-db-net
    depends_on:
      pci-db:
        condition: service_healthy
    ports:
      - "8001:8000"

  core-db:
    image: ${POSTGRES_IMAGE}
    container_name: neobank-core-db
    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
    networks:
      - core-db-net
    volumes:
      - core-db-data:/var/lib/postgresql/data
      - ./db/core/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pci-db:
    image: ${POSTGRES_IMAGE}
    container_name: neobank-pci-db
    environment:
      POSTGRES_DB: ${PCI_DB_NAME}
      POSTGRES_USER: ${PCI_DB_USER}
      POSTGRES_PASSWORD: ${PCI_DB_PASSWORD}
    networks:
      - pci-db-net
    volumes:
      - pci-db-data:/var/lib/postgresql/data
      - ./db/pci/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PCI_DB_USER} -d ${PCI_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dmz-net:
    name: ${DMZ_NET}
    driver: bridge

  corp-net:
    name: ${CORP_NET}
    driver: bridge

  core-net:
    name: ${CORE_NET}
    driver: bridge

  pci-net:
    name: ${PCI_NET}
    driver: bridge

  core-db-net:
    name: ${CORE_DB_NET}
    driver: bridge

  pci-db-net:
    name: ${PCI_DB_NET}
    driver: bridge

volumes:
  core-db-data:
  pci-db-data:
